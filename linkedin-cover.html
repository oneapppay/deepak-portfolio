<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700;800&display=swap");

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1584px; height: 396px; overflow: hidden; background: #05070c; }

      .banner {
        width: 1584px;
        height: 396px;
        position: relative;
        background:
          radial-gradient(900px 280px at 88% 80%, rgba(212, 175, 55, 0.1), transparent 55%),
          radial-gradient(700px 240px at 18% 0%, rgba(212, 175, 55, 0.08), transparent 50%),
          linear-gradient(180deg, #0a0d14 0%, #05070c 100%);
        color: #f4f1ea;
        font-family: Inter, sans-serif;
        overflow: hidden;
      }

      .geo { position: absolute; inset: 0; pointer-events: none; }
      .geo::before, .geo::after {
        content: "";
        position: absolute;
        background: linear-gradient(90deg, transparent, #d4af37 40%, #f3de9a 70%, transparent);
        opacity: 0.85;
      }
      .geo::before {
        width: 420px; height: 2px; top: 34px; left: -40px; transform: rotate(-18deg);
        box-shadow: 0 18px 0 -1px rgba(212, 175, 55, 0.35);
      }
      .geo::after {
        width: 380px; height: 2px; right: -50px; bottom: 48px; transform: rotate(-18deg);
        box-shadow: 0 16px 0 -1px rgba(212, 175, 55, 0.28);
      }

      .safe {
        position: relative;
        height: 100%;
        padding: 42px 88px 36px 280px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }

      .name { display: flex; align-items: baseline; gap: 18px; line-height: 0.9; }
      .first {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 64px;
        font-weight: 500;
        color: #f7f4ee;
      }
      .last {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #e0b64a;
        text-transform: uppercase;
      }
      .rule { width: 220px; height: 2px; background: linear-gradient(90deg, #e0b64a, transparent); }
      .roles {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: #ece7dc;
      }
      .meta {
        display: flex;
        gap: 22px;
        align-items: center;
        color: #c8c2b4;
        font-size: 14px;
        font-weight: 500;
      }
      .dot { width: 4px; height: 4px; border-radius: 50%; background: #d4af37; }
      .stack { display: flex; gap: 10px; margin-top: 8px; }
      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(224, 182, 74, 0.22);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: #f3efe6;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="geo"></div>
      <div class="safe">
        <div class="name">
          <span class="first">Deepak</span>
          <span class="last">R</span>
        </div>
        <div class="rule"></div>
        <div class="roles">Sr. DevOps / Cloud Engineer &nbsp;|&nbsp; AWS &nbsp;|&nbsp; Azure &nbsp;|&nbsp; Kubernetes</div>
        <div class="meta">
          <span>Plano, Texas, USA</span>
          <i class="dot"></i>
          <span>5+ Years Experience</span>
          <i class="dot"></i>
          <span>JPMorgan Chase</span>
        </div>
        <div class="stack">
          <div class="chip">AWS</div>
          <div class="chip">Azure</div>
          <div class="chip">Terraform</div>
          <div class="chip">Kubernetes</div>
          <div class="chip">EKS / AKS</div>
          <div class="chip">Jenkins</div>
          <div class="chip">GitLab CI/CD</div>
          <div class="chip">CI/CD</div>
        </div>
      </div>
    </div>
  </body>
</html>
